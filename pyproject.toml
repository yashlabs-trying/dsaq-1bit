[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefly-dsaq"
version = "0.1.0"
description = "Falsification-driven experiments toward practical one-bit LLM weight representations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.45,<5",
  "datasets>=3.0,<5",
  "numpy>=1.26",
  "pandas>=2.2",
  "tabulate>=0.9",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dsaq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
